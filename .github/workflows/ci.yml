name: CI and extension packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Check and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Install Chromium once for tests and packaging
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Package extension
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      - name: Verify CRX signature, archive contents, and checksums
        if: github.event_name != 'pull_request'
        run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: contributor-lens-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: contributor-lens-${{ github.sha }}
          path: dist
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes --title "Contributor Lens $RELEASE_TAG"
          fi
